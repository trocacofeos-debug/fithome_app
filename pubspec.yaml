name: home_workout_app
description: App de treinos em casa com painéis de Aluno, Instrutor e Admin.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Estado
  provider: ^6.1.2

  # Rotas
  go_router: ^14.6.2

  # Cloudflare R2 (compatível com S3) - usado via pacote minio/http assinado
  minio: ^3.5.1
  http: ^1.2.2
  uuid: ^4.5.1

  # UI / utilidades
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  image_picker: ^1.1.2
  file_picker: ^8.1.3
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.69.0
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#0D0D0D"
    theme_color: "#0D0D0D"
  windows:
    generate: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  # Fundo escuro atrás do ícone "adaptativo" do Android (evita bordas
  # brancas se a sua logo tiver fundo transparente)
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icon/